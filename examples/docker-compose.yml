# nvkvm-kata: selecting the runtime per container.
#
#   docker compose -f examples/docker-compose.yml up --abort-on-container-exit smi
#
# USE `up`, NOT `run`.  `docker compose run` attaches the container's stdin, and
# stdin-attach is broken for Kata on Docker 28.1.1 -- MEASURED, and measured
# with STOCK Kata as the control, so it is nothing to do with nvkvm:
#
#   docker run --rm    --runtime kata-stock ubuntu:24.04 uname -r  -> 6.18.35
#   docker run --rm -i --runtime kata-stock ubuntu:24.04 uname -r  -> ttrpc: closed
#   docker run --rm    --runtime nvkvm-kata ubuntu:24.04 uname -r  -> 6.18.35-nvkvm
#   docker run --rm -i --runtime nvkvm-kata ubuntu:24.04 uname -r  -> ttrpc: closed
#   docker run --rm -i                      ubuntu:24.04 uname -r  -> 6.8.0-59-generic (runc, fine)
#
# See docs/design/evidence/08/stdin-attach-control.log.  `up`, `up -d` and
# plain `docker run` are unaffected.
#
# TWO lines select the whole thing: `runtime:` picks the VM+GPU runtime, and the
# `deploy.resources.reservations.devices` block is compose's spelling of
# `--gpus all`.  There is deliberately NO `volumes:` for driver libraries and NO
# LD_LIBRARY_PATH: the host driver's userspace arrives on its own, and ldconfig
# has run inside the container before your command does.
# See docs/design/09-gpu-libraries-automatically.md.
#
# Change `runtime:` to `runc` (or delete it) and the same service runs on the
# host's default runtime -- which is the point: stock Kata and runc are
# untouched and still work.

x-gpu: &gpu
  runtime: nvkvm-kata
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all            # or `device_ids: ["0"]`, like --gpus '"device=0"'
            capabilities: [gpu]

services:

  # A stock NVIDIA CUDA image, unmodified, doing the obvious thing.
  smi:
    <<: *gpu
    image: nvidia/cuda:13.3.1-cudnn-devel-ubuntu26.04
    command: nvidia-smi

  # The proof.  A CUDA vector-add on the driver API with embedded PTX, so it
  # needs no CUDA toolkit in the image.  Prints VECADD OK.
  # The one bind mount is the TEST BINARY, not driver libraries.
  cuda:
    <<: *gpu
    image: ubuntu:24.04
    command: /usr/local/nvidia/bin/vecadd
    volumes:
      - /opt/nvkvm-kata/nvidia/bin:/usr/local/nvidia/bin:ro

  # Control: the same runtime, no GPU requested.  Shows that asking is required
  # -- though note it is NOT an access boundary on cgroup v2, see
  # docs/design/07-end-to-end.md 8.1.
  no-gpu:
    runtime: nvkvm-kata
    image: ubuntu:24.04
    command: /bin/sh -c 'uname -r; ls /dev/nvidia* 2>&1 || echo "no nvidia nodes (expected)"'

  # Control: the host's default runtime.  No GPU, no VM.  Useful when something
  # fails and you need to know which layer broke.
  control:
    image: ubuntu:24.04
    command: /bin/sh -c 'uname -r; ls /dev/nvidia* 2>&1 || echo "no nvidia nodes (expected)"'
